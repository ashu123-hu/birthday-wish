<!DOCTYPE html>
<html>
<head>
<title>For Anjali 🎂</title>

<style>

body{
margin:0;
background:black;
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

.content{
position:relative;
z-index:2;
top:20vh;
}

.name{
font-size:70px;
font-weight:bold;
color:white;
text-shadow:
0 0 10px #ff4da6,
0 0 20px #ff4da6,
0 0 40px #ff4da6;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 10px #ff4da6;}
to{ text-shadow:0 0 40px #ff4da6;}
}

button{
margin-top:30px;
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
background:#ff4da6;
color:white;
cursor:pointer;
}

#message{
display:none;
margin-top:20px;
font-size:22px;
}

img{
width:180px;
border-radius:20px;
margin-top:20px;
display:none;
animation:zoom 2s ease;
}

@keyframes zoom{
from{transform:scale(0);}
to{transform:scale(1);}
}

/* Floating hearts */

.heart{
position:absolute;
bottom:-20px;
font-size:20px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-100vh);}
}

</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="content">

<div class="name">ANJALI</div>

<button onclick="showSurprise()">Open Surprise 🎁</button>

<div id="message">
🎂 Happy Birthday in Advance Anjali 🎉  
<br><br>
May your life be filled with happiness, smiles and beautiful memories ✨  
<br><br>
– From Ashwani 💫
</div>

<img id="photo" src="https://i.imgur.com/8Km9tLL.jpg">

</div>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

<script>

/* show message */

function showSurprise(){
document.getElementById("message").style.display="block";
document.getElementById("photo").style.display="block";
document.getElementById("music").play();
}

/* floating hearts */

function createHeart(){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(Math.random()*20+10)+"px";

document.body.appendChild(heart);

setTimeout(()=>{heart.remove();},6000);
}

setInterval(createHeart,400);

/* fireworks */

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function createFirework(){
let x=Math.random()*canvas.width;
let y=Math.random()*canvas.height/2;

for(let i=0;i<60;i++){
particles.push({
x:x,
y:y,
vx:(Math.random()-0.5)*6,
vy:(Math.random()-0.5)*6,
life:100
});
}
}

function animate(){
ctx.fillStyle="rgba(0,0,0,0.2)";
ctx.fillRect(0,0,canvas.width,canvas.height);

particles.forEach((p,i)=>{
p.x+=p.vx;
p.y+=p.vy;
p.life--;

ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
ctx.fillRect(p.x,p.y,3,3);

if(p.life<=0){
particles.splice(i,1);
}
});

requestAnimationFrame(animate);
}

setInterval(createFirework,800);
animate();

</script>

</body>
</html>
